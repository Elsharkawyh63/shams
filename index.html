 if(reactionPrepared.has(kind))return reactionPrepared.get(kind);
 const cfg=CONFIG.reactions[kind];
 const task=Promise.all(Array.from({length:cfg.count},(_,i)=>new Promise(resolve=>{
   const im=imgFor(cfg.folder,i);
   if(im.complete)return resolve(im.naturalWidth>0);
   im.addEventListener('load',()=>resolve(true),{once:true});
   im.addEventListener('error',()=>resolve(false),{once:true});
 }))).then(results=>results.every(Boolean));
 reactionPrepared.set(kind,task);
 return task;
}
function stopQuestionTimers(){answerTimers.forEach(clearTimeout);answerTimers=[];if(nextQuestionTimer){clearTimeout(nextQuestionTimer);nextQuestionTimer=null;}}
function resetReaction(){
 reactionGeneration++;reactionToken++;
 if(reactionRAF)cancelAnimationFrame(reactionRAF);reactionRAF=null;
 // Restore the stable character and remove the overlay in one paint.
 els.character.style.opacity='1';
 reaction.style.opacity='0';
 reactionFrame.removeAttribute('src');
}
function renderQuestion(){
 stopQuestionTimers();resetReaction();questionLocked=false;feedback.textContent='';
 $('quizComplete').hidden=true;
 $('quizQuestion').textContent=QUESTIONS[questionIndex].question;
 answersHost.replaceChildren();
 QUESTIONS[questionIndex].options.forEach((value,i)=>{
   const button=document.createElement('button');
   button.type='button';button.className='answer';button.textContent=value;
   button.disabled=true;button.addEventListener('click',()=>checkAnswer(i));answersHost.append(button);
   answerTimers.push(setTimeout(()=>{if(!quizShown||questionLocked)return;button.classList.add('visible');button.disabled=false;},250+i*1000));
 });
 const pane=quiz.querySelector('.quiz-inner');pane.scrollTop=0;
}
function showQuiz(){
 if(quizShown)return;quizShown=true;quizOpen=true;
 quiz.classList.add('show');els.character.style.opacity='1';
 renderQuestion();
 prepareReaction('correct');prepareReaction('wrong');
}
function hideQuiz(){
 if(!quizShown)return;
 quizShown=false;quizOpen=false;quiz.classList.remove('show');
 stopQuestionTimers();resetReaction();feedback.textContent='';
}
async function playReaction(kind,onFinish){
 resetReaction();const generation=reactionGeneration;
 const cfg=CONFIG.reactions[kind];
 const loaded=await prepareReaction(kind);
 if(generation!==reactionGeneration||!quizShown)return;
 if(!loaded){
   // Fail gracefully without ever hiding Sama or freezing the quiz.
   feedback.textContent+=' — ملفات الرياكشن مش متاحة';
   if(typeof onFinish==='function')onFinish();
   return;
 }
 const first=imgFor(cfg.folder,0);
 reactionFrame.src=first.src;
 // First frame is already fully loaded. No empty-image flash.
 reaction.style.transform=els.character.style.transform;
 reaction.style.opacity='1';
 els.character.style.opacity='0';
 let began=null,lastIdx=0;
 function tick(t){
   if(generation!==reactionGeneration||!quizShown)return;
   if(began===null)began=t;
   const progress=clamp((t-began)/4000);
   const index=Math.min(cfg.count-1,Math.floor(progress*(cfg.count-1)));
   if(index!==lastIdx){lastIdx=index;reactionFrame.src=imgFor(cfg.folder,index).src;}
   if(progress<1)reactionRAF=requestAnimationFrame(tick);
   else{
     reactionRAF=null;
     // Restore the original character before the next question is shown.
     resetReaction();
     if(quizShown&&typeof onFinish==='function')onFinish();
   }
 }
 reactionRAF=requestAnimationFrame(tick);
}
function checkAnswer(index){
 if(!quizShown||questionLocked)return;
 const question=QUESTIONS[questionIndex],correct=index===question.correct;
 const kind=correct?'correct':'wrong';
 questionLocked=true;stopQuestionTimers();
 const buttons=Array.from(answersHost.querySelectorAll('.answer'));
 buttons.forEach(b=>b.disabled=true);
 const selected=buttons[index];
 selected.blur();selected.classList.add(kind);
 // A short click flash; clear *before* the reaction or next question finishes.
 answerTimers.push(setTimeout(()=>selected.classList.remove('correct','wrong'),280));
 feedback.textContent=responsePhrase(kind);
 playReaction(kind,()=>{
   if(!quizShown)return;
   if(correct){
     if(questionIndex<QUESTIONS.length-1){questionIndex++;renderQuestion();}
     else{answersHost.replaceChildren();$('quizQuestion').textContent='';$('quizComplete').hidden=false;feedback.textContent='';questionLocked=true;}
   }else{
     questionLocked=false;
     buttons.forEach(b=>{b.disabled=!b.classList.contains('visible');b.classList.remove('correct','wrong');});
   }
 });
}
function playPeekThenStart(){
 if(starting||active)return;starting=true;els.intro.classList.add('out');peekLayer.style.opacity='1';let first=null;
 function tick(t){if(first===null)first=t;const idx=Math.min(CONFIG.intro.count-1,Math.floor((t-first)/(4000/CONFIG.intro.count)));
 const im=imgFor(CONFIG.intro.folder,idx);if(im.complete&&im.naturalWidth)peekFrame.src=im.src;else im.addEventListener('load',()=>{if(!active)peekFrame.src=im.src},{once:true});
 if(t-first<4000)requestAnimationFrame(tick);else{peekLayer.style.opacity='0';setTimeout(()=>{peekLayer.style.display='none';startScroll()},300);}}
 requestAnimationFrame(tick);
}
function render(){
 if(!active)return;
 const max=CONFIG.clips.length*CONFIG.scrollPixelsPerClip;
 const p=clamp(current/Math.max(1,max));
 const clipPos=Math.min(CONFIG.clips.length-0.000001,p*CONFIG.clips.length);
 const ci=Math.floor(clipPos);
 const clipProgress=clamp(clipPos-ci);
 const clip=CONFIG.clips[ci];
 const local=ease(clipProgress);
 els.bar.style.width=(p*100)+'%';
 if(p>.78&&!reactionPrepared.size){prepareReaction('correct');prepareReaction('wrong');}
 if(p>=.9995)showQuiz();else if(quizShown)hideQuiz();
 const fi=Math.min(clip.count-1,Math.floor(local*(clip.count-1)));
 paint(clip.folder,fi);
 for(let n=Math.max(0,fi-2);n<=Math.min(clip.count-1,fi+4);n++)imgFor(clip.folder,n);
 if(fi>=clip.count-6&&ci<CONFIG.clips.length-1){for(let n=0;n<5;n++)imgFor(CONFIG.clips[ci+1].folder,n);}
 // Character stays left. Visual entrance comes from beyond left screen edge.
 const enter=ease(segment(p,0,.18));
 const width=els.character.getBoundingClientRect().width;
 const endX=innerWidth>800?innerWidth*.05:innerWidth*.035;
 const beginX=-width-40;
 const charX=beginX+(endX-beginX)*enter;
 els.character.style.transform=`translate3d(${charX}px,0,0)`;
 reaction.style.transform=els.character.style.transform;
 // Each clip reveals its caption over the first 65%, then holds it.
 // Captions already completed stay in the page; only the column shifts upward.
 words.forEach((w,i)=>{
  const k=i<ci?1:i>ci?0:segment(clipProgress,i===0?.28:.08,.68);
  const firstPart=w.fullTitle?Math.min(.70,Math.max(.2,w.fullTitle.length/(w.fullTitle.length+w.fullBody.length||1))):0;
  if(w.fullTitle&&w.fullBody){
   revealLetters(w.title,w.fullTitle,segment(k,0,firstPart));
   revealLetters(w.body,w.fullBody,segment(k,firstPart,1));
  }else{
   revealLetters(w.title,w.fullTitle,k);
   revealLetters(w.body,w.fullBody,k);
  }
 });
 // Hold the fully written text long enough to read; move up near clip end.
 const lift=ease(segment(clipProgress,.78,.99));
 const here=articles[ci].offsetTop;
 const viewH=els.copy.clientHeight;
 const next=ci===articles.length-1 ? here+articles[ci].offsetHeight+viewH*.7 : articles[ci+1].offsetTop;
 const position=here+(next-here)*lift;
 els.story.style.transform=`translateY(${Math.round(viewH*.22-position)}px)`;
 els.tip.style.opacity=String(1-segment(p,.03,.19));
}
// Native wheel/touch scroll is never converted into automatic whole-scene playback.
// Smooth interpolation follows the actual scroll offset in both directions.
function loop(){
 if(active){
  current+=(target-current)*.16;
  if(Math.abs(target-current)<.14)current=target;
  render();
 }
 requestAnimationFrame(loop);
}
function startScroll(){if(active)return;active=true;els.intro.classList.add('out');document.body.classList.replace('locked','started');document.body.style.height=`calc(100dvh + ${CONFIG.clips.length*CONFIG.scrollPixelsPerClip}px)`;scrollTo(0,0);current=target=0;render()}
document.addEventListener('dblclick',playPeekThenStart);
document.addEventListener('touchend',()=>{if(active||starting)return;const t=Date.now();if(t-lastTap<330)playPeekThenStart();lastTap=t},{passive:true});
document.addEventListener('keydown',e=>{if(!active&&(e.key==='Enter'||e.key===' ')){e.preventDefault();playPeekThenStart()}});
window.addEventListener('scroll',()=>{if(active)target=clamp(window.scrollY,0,CONFIG.clips.length*CONFIG.scrollPixelsPerClip)},{passive:true});
addEventListener('resize',()=>{if(active){target=clamp(scrollY,0,CONFIG.clips.length*CONFIG.scrollPixelsPerClip);render()}});
imgFor(CONFIG.intro.folder,0);imgFor(CONFIG.clips[0].folder,0);requestAnimationFrame(loop);
})();
</script></body></html>
